name: cra
version: git
summary: Text-mode interface for arc
license: GPL-2.0-or-later
description: |
  Cra is an ncurses-based text-mode interface for Arc. It provides history,
  diff, tree, blob, blame, refs, status, and full-file staging views.

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: strict

base: core18

plugs:
  config-cra:
    interface: personal-files
    read:
      - $HOME/.crarc

apps:
  cra:
    command: bin/cra
    plugs:
      - config-cra

parts:
  cra:
    source: .
    plugin: autotools
    build-packages:
      - pkg-config
      - libncursesw5-dev
      - libreadline-dev
